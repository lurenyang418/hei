name: 构建并推送 Docker 镜像

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    name: Prepare image metadata
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Compute channel and tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          channel="stable"
          tags=""

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            case "${GITHUB_REF_NAME}" in
              *beta*) channel="beta" ;;
              *dev*) channel="dev" ;;
              *) channel="stable" ;;
            esac

            case "$channel" in
              stable) tags="$image:latest" ;;
              beta) tags="$image:beta,$image:beta-latest" ;;
              dev) tags="$image:dev,$image:dev-latest" ;;
            esac
            tags="$tags,$image:${GITHUB_REF_NAME}"
          else
            case "${GITHUB_REF_NAME}" in
              dev) channel="dev" ;;
              beta) channel="beta" ;;
              *) channel="stable" ;;
            esac
            # 手动触发只打一次性标签，不覆盖 latest / beta / dev
            tags="$image:manual-${GITHUB_RUN_NUMBER}"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Channel: $channel"
          echo "Tags: $tags"

  build_frontend:
    name: Build frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v6
        with:
          name: web-build
          path: web/build
          retention-days: 1

  build_binaries:
    name: Build Linux binaries
    needs:
      - prepare
      - build_frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BILI_SYNC_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-musl
            name: Linux-x86_64-musl
            bin: bili-sync-rs
            archive_name: bili-sync-rs-Linux-x86_64-musl.tar.gz
          - target: aarch64-unknown-linux-musl
            name: Linux-aarch64-musl
            bin: bili-sync-rs
            archive_name: bili-sync-rs-Linux-aarch64-musl.tar.gz
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reset frontend build output
        shell: bash
        run: |
          rm -rf web/build
          mkdir -p web/build

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: web/build

      - name: Read Rust toolchain version
        id: read_rust_toolchain
        shell: bash
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')
          echo "value=$channel" >> "$GITHUB_OUTPUT"

      - name: Install unzip on Linux runners
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: 缓存 cargo 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          key: docker-${{ matrix.platform.target }}

      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          toolchain: ${{ steps.read_rust_toolchain.outputs.value }}
          args: "--locked --release -p bili_sync"
          strip: true

      - name: Package archive
        shell: bash
        run: |
          cd target/${{ matrix.platform.target }}/release
          tar czf "../../../${{ matrix.platform.archive_name }}" "${{ matrix.platform.bin }}"

      - name: Upload binary archive
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform.archive_name }}
          path: ${{ github.workspace }}/${{ matrix.platform.archive_name }}
          retention-days: 1

  build_and_push:
    name: Build and Push Docker Image
    needs:
      - prepare
      - build_binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Linux x86_64 binary
        uses: actions/download-artifact@v8
        with:
          name: bili-sync-rs-Linux-x86_64-musl.tar.gz
          path: ./

      - name: Download Linux ARM64 binary
        uses: actions/download-artifact@v8
        with:
          name: bili-sync-rs-Linux-aarch64-musl.tar.gz
          path: ./

      - name: List downloaded files
        run: ls -la *.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BILI_SYNC_RELEASE_CHANNEL=${{ needs.prepare.outputs.channel }}

      - name: Test Docker image
        shell: bash
        run: |
          first_tag=$(echo "${{ needs.prepare.outputs.tags }}" | cut -d',' -f1)
          docker run --rm "$first_tag" --help | head -5 || echo "Docker image test completed"
